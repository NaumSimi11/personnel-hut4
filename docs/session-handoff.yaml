# TWO SESSIONS IN ONE WORKING TREE, 2026-09-23 — read this before assuming anything
concurrent_work_2026_09_23:
  what_happened: another session wrote `0081_delete_job_application.sql`, a "Delete application" button on the job page, `supabase/tests/delete-job-application.sql` and a line in `local-verify.sh`, while this session was writing slice 063. JobPage.vue was rewritten at 14:54 and THIS SESSION'S job-page delete was lost — only its import survived, and was removed. Nothing else of either side was lost.
  lesson: two agents editing one tree lose work quietly. Check `git status` and file mtimes before assuming an edit survived.
  the_disagreement_left_open:
    - there are now TWO rules for deleting an application. `detach_candidate_from_job` (0074, this session) refuses if anything at all happened — imported, hired, owned, past New, any event. `delete_job_application` (0081, the other session) refuses only files, interviews and offers, and deliberately allows deleting a HIRED application, with a test asserting exactly that.
    - the other session's intent is legitimate and stated in its header — clearing mistaken and test applications, which is a real need on live (the leftover E2E hires).
    - the cost is real too: `applications.employment_period_id` is how the app knows which application somebody was hired from. `link_hired_application` sets it and the imported-hire card reads it. Delete the application and the employment row survives, but the answer to "how did this person get here" is gone, silently, from a button on a job list.
    - a guard was written (0082) and WITHDRAWN rather than override a deliberate choice; the other session's test would have failed. The maintainer said "push everything", so 0081 ships as its author wrote it and was applied live.
    - TO DECIDE: one rule or two. If one, fold 0081's file/interview/offer wording into detach_candidate_from_job and drop the second function.

