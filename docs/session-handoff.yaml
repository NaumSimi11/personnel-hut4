decisions_2026_09_16:
  - net pay: implement the prototype's model for now (tax % + flat deductions per company → net), replace later
  - checklists: always per person (what / who / where on every line); templates per company are only the starting list
  - IT owner role: use existing workflow owner `it_owner`; on hire confirmed / onboarding done / departure an automatic email goes to every configured recipient with exactly their fields (handover matrix: who · where · what); per recipient green when sent, red when not / missing data, editable by hand (mark sent / resend); the accountant receives bank account (and national ID) — both fields must be added to private details
  - equipment: holding-wide pool, assignable to any employee by anyone with it.assign anywhere; generated PDFs — handover form on issue, return form auto-generated on scheduled departure — signed scan uploaded back as evidence; PDF via pdfmake on the server; document_templates per company/language
  - entry experience is the real gap ("100x better app, worse entry"): one Add employee form, edit where shown, replace all 14 window.prompt/confirm with dialogs, HR (employment.edit) may add departments/locations

