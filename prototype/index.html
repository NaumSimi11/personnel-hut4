<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personnel · Workspace design</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview"><span class="brand-mark">p.</span><span>Personnel<small>Holding workspace</small></span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="navigation" aria-label="Workspace"></nav>
      <div class="sidebar-bottom"><span class="avatar">AD</span><div><strong>You, Admin</strong><small>All four companies</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="scope"><span class="scope-icon" aria-hidden="true">▦</span><label for="company-select">Company</label><select id="company-select" aria-label="Company scope"></select></div><div class="top-actions"><label class="scope" style="gap:8px"><span class="field-label" style="font-size:11px">View as</span><select id="view-as" aria-label="View workspace as"></select></label><span class="demo-pill">DESIGN PROTOTYPE</span><button class="text-button" id="reset-demo">Reset demo</button></div></header>
      <div class="prototype-note">Sample names and records · Changes are saved in this browser only · External publishing and access enforcement are simulated.</div>
      <div id="viewas-banner" hidden></div>
      <main id="main" tabindex="-1"></main>
      <footer>Personnel / Design round 01 <span>Company access & the hiring journey</span></footer>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
