<style>
  :root{
    --ink:#1D2430;
    --ink-soft:#4A5264;
    --paper:#F5F4F1;
    --surface:#FFFFFF;
    --border:#DEDBD3;
    --accent:#2F5D53;
    --accent-soft:#E4ECE9;
    --amber:#A8752F;
    --amber-soft:#F3E9D9;
    --red:#A8443A;
    --red-soft:#F5E3E0;
    --blue:#3C5E82;
    --blue-soft:#E3E9F0;
    --font-head:'Newsreader', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  #hr-app {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    min-height: 600px;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .hr-sidebar {
    width: 208px;
    flex-shrink: 0;
    background: var(--ink);
    color: #E9E7E1;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
  }
  .hr-brand {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.2px;
    padding: 0 8px 20px 8px;
    border-bottom: 1px solid rgba(233,231,225,0.15);
    margin-bottom: 16px;
  }
  .hr-brand span { display:block; font-family: var(--font-body); font-size: 11px; color: #A6ABB8; margin-top: 2px; }
  .hr-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13.5px;
    color: #C9CAD1;
    margin-bottom: 2px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .hr-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .hr-nav-item.active { background: var(--accent); color: #fff; }
  .hr-nav-count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #9EA3AF;
  }
  .hr-nav-item.active .hr-nav-count { color: rgba(255,255,255,0.75); }
  .hr-sidebar-foot { margin-top: auto; font-size: 11px; color: #7D8290; padding: 0 8px; line-height: 1.5; }

  .hr-role-picker { padding: 0 8px 14px 8px; }
  .hr-role-picker label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: #8A8F9C; margin-bottom: 5px; }
  .hr-role-picker select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 12.5px;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: #fff;
    cursor: pointer;
  }
  .hr-role-picker select option { color: var(--ink); }

  /* ---------- Main ---------- */
  .hr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hr-topbar {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .hr-topbar h1 { font-family: var(--font-head); font-size: 22px; font-weight: 500; margin: 0; }
  .hr-topbar p { margin: 2px 0 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .hr-content { padding: 24px 28px; overflow-y: auto; flex: 1; }

  .hr-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.12s ease;
  }
  .hr-btn:hover { opacity: 0.88; }
  .hr-btn.secondary { background: transparent; color: var(--ink); border-color: var(--border); }
  .hr-btn.secondary:hover { background: var(--paper); }
  .hr-btn.small { padding: 5px 10px; font-size: 12px; }
  .hr-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- Cards / stats ---------- */
  .hr-stat-row { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .hr-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    min-width: 140px;
    flex: 1;
  }
  .hr-stat .num { font-family: var(--font-head); font-size: 28px; line-height: 1; }
  .hr-stat .label { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  /* ---------- Table ---------- */
  .hr-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  table.hr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hr-table th {
    text-align: left;
    font-weight: 500;
    color: var(--ink-soft);
    font-size: 11.5px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #FAFAF8;
  }
  table.hr-table td { padding: 10px 14px; border-bottom: 1px solid #EEECE6; vertical-align: middle; }
  table.hr-table tr:last-child td { border-bottom: none; }
  table.hr-table tr:hover td { background: #FBFAF7; }

  .hr-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .pill-applied { background: var(--blue-soft); color: var(--blue); }
  .pill-screening { background: var(--blue-soft); color: var(--blue); }
  .pill-interview { background: var(--amber-soft); color: var(--amber); }
  .pill-offer { background: var(--amber-soft); color: var(--amber); }
  .pill-hired { background: var(--accent-soft); color: var(--accent); }
  .pill-rejected { background: var(--red-soft); color: var(--red); }
  .pill-active { background: var(--accent-soft); color: var(--accent); }
  .pill-leave { background: var(--amber-soft); color: var(--amber); }
  .pill-terminated { background: var(--red-soft); color: var(--red); }

  select.hr-stage-select {
    font-family: var(--font-body);
    font-size: 11.5px;
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 3px 8px;
    background: #fff;
    color: var(--ink);
  }

  .hr-row-actions { display: flex; gap: 6px; }
  .hr-link-btn {
    background: none; border: none; color: var(--ink-soft); font-size: 12px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px; padding: 0;
  }
  .hr-link-btn:hover { color: var(--ink); }
  .hr-link-btn.danger:hover { color: var(--red); }

  /* ---------- Forms ---------- */
  .hr-form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .hr-form-panel h3 { font-family: var(--font-head); font-size: 16px; font-weight: 500; margin: 0 0 14px 0; }
  .hr-form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
  .hr-field label { display: block; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .hr-field input, .hr-field select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  .hr-field input:focus, .hr-field select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .hr-form-actions { margin-top: 14px; display: flex; gap: 8px; }

  .hr-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .hr-toolbar .hr-tabs { display: flex; gap: 4px; }
  .hr-subtab {
    font-size: 12.5px; padding: 6px 12px; border-radius: 5px; cursor: pointer;
    color: var(--ink-soft); border: 1px solid transparent;
  }
  .hr-subtab.active { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 500; }

  .hr-empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); font-size: 13px; }
  .hr-empty strong { display:block; font-family: var(--font-head); font-size: 16px; color: var(--ink); margin-bottom: 4px; font-weight: 500; }

  .hr-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }

  .hr-payslip-detail { padding: 4px 0 0 0; font-size: 12px; color: var(--ink-soft); }
  .hr-payslip-detail table { width:100%; font-size: 12.5px; margin-top: 8px; }
  .hr-payslip-detail td { padding: 4px 0; }
  .hr-payslip-detail td.amt { text-align: right; font-family: var(--font-mono); }
  .hr-payslip-detail tr.total td { border-top: 1px solid var(--border); padding-top: 8px; font-weight: 600; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #D3D0C8; border-radius: 4px; }

  /* ---------- Openings ---------- */
  .hr-opening-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .hr-opening-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .hr-opening-head h4 { font-family: var(--font-head); font-size: 17px; font-weight: 500; margin: 0 0 4px 0; }
  .hr-opening-meta { font-size: 12px; color: var(--ink-soft); }
  .hr-opening-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; max-width: 70ch; }

  /* ---------- Onboarding ---------- */
  .hr-onboard-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .hr-onboard-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .hr-onboard-head h4 { font-family: var(--font-head); font-size: 16px; font-weight: 500; margin: 0; }
  .hr-progress-track { width: 100%; height: 6px; background: #EEECE6; border-radius: 4px; overflow: hidden; margin: 10px 0 12px 0; }
  .hr-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.15s ease; }
  .hr-task-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  .hr-task-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .hr-task-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .hr-task-item label { cursor: pointer; }
  .hr-task-item.done label { color: var(--ink-soft); text-decoration: line-through; }

  /* ---------- Materials ---------- */
  .hr-material-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEECE6; font-size: 13px; }
  .hr-material-row:last-child { border-bottom: none; }
  .hr-material-row .item-name { flex: 1; }
  .hr-add-item-row { display: flex; gap: 8px; margin-top: 10px; }
  .hr-add-item-row input { flex: 1; font-family: var(--font-body); font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 4px; }
  .hr-quick-add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .hr-quick-add button { font-size: 11.5px; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border); background: #FAFAF8; color: var(--ink-soft); cursor: pointer; }
  .hr-quick-add button:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }

  .hr-form-subhead {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-soft);
    margin: 18px 0 8px 0; padding-top: 12px; border-top: 1px solid #EEECE6;
  }
  .hr-form-panel form > .hr-form-subhead:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

  .hr-emp-detail {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    padding: 14px 4px 6px 4px;
  }
  .hr-emp-detail-col h5 { font-family: var(--font-head); font-size: 13px; font-weight: 500; margin: 0 0 8px 0; color: var(--ink); }
  .hr-emp-detail-col div { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid #F1EFEA; }
  .hr-emp-detail-col div span { color: var(--ink-soft); }
  .hr-emp-detail-col div strong { font-weight: 500; text-align: right; }

  .hr-welcome-note { margin-top: 14px; padding-top: 14px; border-top: 1px solid #EEECE6; }
  .hr-welcome-note details summary { font-size: 12px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .hr-welcome-note details pre {
    white-space: pre-wrap;
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.6;
    background: #FAFAF8;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px 14px;
    margin-top: 8px;
  }

  /* ---------- Home ---------- */
  .hr-home-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .hr-home-grid3 { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 20px; align-items: start; }
  .hr-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 22px 0 10px 0;
  }
  .hr-fun-panel { background: linear-gradient(160deg, var(--accent-soft) 0%, var(--surface) 65%); }
  .hr-fun-fact { font-size: 13px; line-height: 1.6; padding: 6px 0; border-bottom: 1px solid #EEECE6; }
  .hr-fun-fact:last-of-type { border-bottom: none; }
  .hr-shoutout-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid #EEECE6; }
  .hr-shoutout-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px;
  }
  .hr-kudos-item { padding: 12px 0; border-bottom: 1px solid #EEECE6; }
  .hr-kudos-item:last-child { border-bottom: none; }
  .hr-kudos-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .hr-kudos-msg { font-size: 13px; color: var(--ink); line-height: 1.5; margin-bottom: 4px; }
  .hr-home-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #EEECE6; font-size: 13px; }
  .hr-home-list-item:last-child { border-bottom: none; }
</style>

<div id="hr-app"></div>

<script>
(function(){
  const root = document.getElementById('hr-app');

  const STAGES = ['Applied','Screening','Interview','Offer','Hired','Rejected'];
  const STATUSES = ['Active','On Leave','Terminated'];
  const DEPARTMENTS = ['Engineering','Sales','Marketing','Operations','Finance','People'];
  const OPENING_STATUSES = ['Open','Filled','Closed'];
  const DEFAULT_ONBOARDING_TASKS = [
    'Offer letter signed', 'I-9 / tax forms completed', 'IT account & email created',
    'Equipment assigned', 'Building & system access', 'Orientation session',
    'Payroll & benefits enrollment', 'First 1:1 with manager'
  ];
  const DEFAULT_POLICIES = [
    { id: 'pol_conduct', title: 'Code of Conduct', summary: 'Expected standards of professional behavior, ethics, and workplace conduct.' },
    { id: 'pol_pto', title: 'Time Off & Leave Policy', summary: 'How PTO, sick leave, and holidays are accrued, requested, and approved.' },
    { id: 'pol_remote', title: 'Remote & Hybrid Work Policy', summary: 'Expectations for remote work, core hours, and equipment use.' },
    { id: 'pol_security', title: 'IT & Data Security Policy', summary: 'Password, device, and confidential data handling requirements.' },
    { id: 'pol_harassment', title: 'Anti-Harassment & Equal Opportunity Policy', summary: 'Zero-tolerance policy on harassment and discrimination, and how to report concerns.' },
    { id: 'pol_expenses', title: 'Expense & Reimbursement Policy', summary: 'What counts as a reimbursable expense and how to submit one.' }
  ];
  const QUICK_ADD_MATERIALS = ['Laptop','Monitor','Keyboard & mouse','Badge / access card','Phone','Desk & chair','Software licenses'];

  const ROLES = {
    admin:   { label: 'Admin — full access', tabs: ['home','recruitment','hr','payroll'],
               recruitmentSubtabs: ['openings','applicants'], hrSubtabs: ['employees','onboarding','materials','it'] },
    hr:      { label: 'HR', tabs: ['home','recruitment','hr'],
               recruitmentSubtabs: ['openings','applicants'], hrSubtabs: ['employees','onboarding','materials','it'] },
    finance: { label: 'Finance', tabs: ['home','hr','payroll'],
               recruitmentSubtabs: [], hrSubtabs: ['employees'] },
    it:      { label: 'IT', tabs: ['home','hr'],
               recruitmentSubtabs: [], hrSubtabs: ['onboarding','materials','it'] }
  };
  const TAB_LABELS = {
    home: 'Home', recruitment: 'Recruitment', hr: 'HR', payroll: 'Payroll'
  };
  const RECRUITMENT_SUBTAB_LABELS = { openings: 'Job Openings', applicants: 'Applicants' };
  const HR_SUBTAB_LABELS = { employees: 'Employees', onboarding: 'Onboarding', materials: 'Materials', it: 'IT Notifications' };

  let state = {
    applicants: [],
    employees: [],
    payrollRuns: [],
    openings: [],
    itRequests: [],
    policies: [],
    kudos: [],
    settings: { taxRate: 22, benefitsFlat: 140, itEmail: '' },
    loaded: false
  };

  let ui = {
    tab: 'home',
    role: 'admin',
    roleLoaded: false,
    showApplicantForm: false,
    editApplicantId: null,
    showEmployeeForm: false,
    editEmployeeId: null,
    expandedRunId: null,
    expandedEmployeeId: null,
    showOpeningForm: false,
    editOpeningId: null,
    showPolicyForm: false,
    editPolicyId: null,
    kudosFromDraft: '',
    materialsEmployeeId: null,
    materialsDraftName: '',
    conversionApplicantId: null,
    recruitmentSubtab: 'openings',
    hrSubtab: 'employees',
    funShoutoutId: null,
    storageError: null
  };

  function allowedTabs(){ return (ROLES[ui.role] || ROLES.admin).tabs; }
  function allowedRecruitmentSubtabs(){ return (ROLES[ui.role] || ROLES.admin).recruitmentSubtabs; }
  function allowedHrSubtabs(){ return (ROLES[ui.role] || ROLES.admin).hrSubtabs; }

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
  function hashCode(str){ let h = 0; for (let i=0; i<str.length; i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; } return h; }
  function fmtMoney(n){ return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
  function pillClass(v){ return 'pill-' + v.toLowerCase().replace(/\s+/g,''); }

  async function saveState(){
    try {
      await window.storage.set('hr-database', JSON.stringify({
        applicants: state.applicants,
        employees: state.employees,
        payrollRuns: state.payrollRuns,
        openings: state.openings,
        itRequests: state.itRequests,
        policies: state.policies,
        kudos: state.kudos,
        settings: state.settings
      }), true);
      ui.storageError = null;
    } catch (e) {
      ui.storageError = 'Changes could not be saved to shared storage.';
      console.error('Storage error', e);
    }
    render();
  }

  async function loadState(){
    try {
      const result = await window.storage.get('hr-database', true);
      if (result && result.value) {
        const parsed = JSON.parse(result.value);
        state.applicants = parsed.applicants || [];
        state.employees = parsed.employees || [];
        state.payrollRuns = parsed.payrollRuns || [];
        state.openings = parsed.openings || [];
        state.itRequests = parsed.itRequests || [];
        state.policies = (parsed.policies && parsed.policies.length) ? parsed.policies : DEFAULT_POLICIES.slice();
        state.kudos = parsed.kudos || [];
        state.settings = { taxRate: 22, benefitsFlat: 140, itEmail: '', ...(parsed.settings || {}) };
      }
    } catch (e) {
      // no existing data yet — fine on first run
      console.log('No existing HR data found, starting fresh.');
      state.policies = DEFAULT_POLICIES.slice();
    }
    try {
      const roleResult = await window.storage.get('hr-role', false);
      if (roleResult && roleResult.value && ROLES[roleResult.value]) {
        ui.role = roleResult.value;
      }
    } catch (e) {
      // no saved role yet — default to admin
    }
    if (!allowedTabs().includes(ui.tab)) ui.tab = allowedTabs()[0];
    state.loaded = true;
    render();
  }

  async function setRole(role){
    ui.role = role;
    if (!allowedTabs().includes(ui.tab)) ui.tab = allowedTabs()[0];
    render();
    try {
      await window.storage.set('hr-role', role, false);
    } catch (e) {
      console.error('Could not save role preference', e);
    }
  }

  // ---------- Mutations ----------
  function upsertApplicant(data, id){
    if (id) {
      const idx = state.applicants.findIndex(a => a.id === id);
      state.applicants[idx] = { ...state.applicants[idx], ...data };
    } else {
      state.applicants.push({ id: uid('app'), stage: 'Applied', appliedDate: new Date().toISOString().slice(0,10), ...data });
    }
    ui.showApplicantForm = false;
    ui.editApplicantId = null;
    saveState();
  }

  function setApplicantStage(id, stage){
    const a = state.applicants.find(a => a.id === id);
    if (!a) return;
    a.stage = stage;
    if (stage === 'Hired' && !a.convertedEmployeeId) {
      saveState();
      convertToEmployee(id);
    } else {
      saveState();
    }
  }

  function deleteApplicant(id){
    state.applicants = state.applicants.filter(a => a.id !== id);
    saveState();
  }

  function convertToEmployee(id){
    const a = state.applicants.find(a => a.id === id);
    if (!a || a.convertedEmployeeId) return;
    ui.tab = 'hr';
    ui.hrSubtab = 'employees';
    ui.showEmployeeForm = true;
    ui.editEmployeeId = null;
    ui.conversionApplicantId = id;
    ui.prefillEmployee = {
      name: a.name, email: a.email, position: a.position,
      department: DEPARTMENTS[0], salary: '', hireDate: new Date().toISOString().slice(0,10),
      status: 'Active'
    };
    a.stage = 'Hired';

      state.employees[idx] = { ...state.employees[idx], ...data };
      ui.showEmployeeForm = false;
      ui.editEmployeeId = null;
      ui.prefillEmployee = null;
      saveState();
      return;

    const onboarding = {};
    DEFAULT_ONBOARDING_TASKS.forEach(t => onboarding[t] = false);
    const materials = STANDARD_NEW_HIRE_ITEMS.map(item => ({ id: uid('mat'), item, issued: false, dateIssued: null }));
    const newEmployee = { id: uid('emp'), onboarding, materials, welcomeNoteStatus: 'Pending', ...data };

    if (ui.conversionApplicantId) {
      const a = state.applicants.find(a => a.id === ui.conversionApplicantId);
      if (a) a.convertedEmployeeId = newEmployee.id;
      state.itRequests.unshift({
        id: uid('itreq'),
        employeeId: newEmployee.id,
        name: newEmployee.name,
        position: newEmployee.position,
        department: newEmployee.department,
        startDate: newEmployee.hireDate,
        email: newEmployee.email,
        items: STANDARD_NEW_HIRE_ITEMS.slice(),
        status: 'Pending',
        createdDate: new Date().toISOString().slice(0,10)

      ui.tab = 'it';

    ui.editEmployeeId = null;
    ui.prefillEmployee = null;

  function runPayroll(){
    const active = state.employees.filter(e => e.status === 'Active' && Number(e.salary) > 0);
    if (active.length === 0) return;
    const period = new Date().toISOString().slice(0,10);
    const lines = active.map(e => {
      const gross = Number(e.salary) / 12;
      const tax = gross * (state.settings.taxRate / 100);
      const benefits = Number(state.settings.benefitsFlat);
      const net = gross - tax - benefits;
      return { employeeId: e.id, name: e.name, position: e.position, gross, tax, benefits, net };
    });
    const totalNet = lines.reduce((s,l) => s + l.net, 0);
    const totalGross = lines.reduce((s,l) => s + l.gross, 0);
    state.payrollRuns.unshift({ id: uid('run'), date: period, lines, totalNet, totalGross });
    saveState();
  }

  function daysUntilAnniversary(hireDateStr, today){
    const hire = new Date(hireDateStr + 'T00:00:00');
    if (isNaN(hire)) return null;
    const next = new Date(today.getFullYear(), hire.getMonth(), hire.getDate());
    if (next < today) next.setFullYear(today.getFullYear() + 1);
    const diffDays = Math.round((next - today) / 86400000);
    const years = next.getFullYear() - hire.getFullYear();
    return { diffDays, years };
  }

  function daysUntilBirthday(dobStr, today){
    if (!dobStr) return null;
    const dob = new Date(dobStr + 'T00:00:00');
    if (isNaN(dob)) return null;
    const next = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
    if (next < today) next.setFullYear(today.getFullYear() + 1);
    const diffDays = Math.round((next - today) / 86400000);
    return { diffDays };
  }

                              <td>Total</td><td class="amt">${fmtMoney(r.totalGross)}</td><td></td><td></td><td class="amt">${fmtMoney(r.totalNet)}</td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </td></tr>
                  ` : ''}
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;
  }

  function render(){
    if (!state.loaded) {
      root.innerHTML = `<div style="padding:60px; text-align:center; color:var(--ink-soft); font-family:var(--font-body);">Loading…</div>`;
      return;
    }
    if (!allowedTabs().includes(ui.tab)) ui.tab = allowedTabs()[0];
    let body = '';
    if (ui.tab === 'home') body = renderHome();
    else if (ui.tab === 'recruitment') body = renderRecruitment();
    else if (ui.tab === 'hr') body = renderHR();
    else if (ui.tab === 'payroll') body = renderPayroll();

    root.innerHTML = renderSidebar() + `<div class="hr-main">${body}${ui.storageError ? `<div style="padding:8px 28px; font-size:12px; color:var(--red);">${ui.storageError}</div>` : ''}</div>`;
    attachEvents();
  }

  function attachEvents(){
    const roleSelect = root.querySelector('#role-select');
    if (roleSelect) roleSelect.addEventListener('change', () => setRole(roleSelect.value));

    // Home / Kudos
    const kudosFormEl = root.querySelector('#kudos-form');
    if (kudosFormEl) kudosFormEl.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const fd = new FormData(kudosFormEl);
      giveKudos(fd.get('fromName'), fd.get('toEmployeeId'), fd.get('message'));
    });
    root.querySelectorAll('[data-delete-kudos]').forEach(b => {
      b.addEventListener('click', () => deleteKudos(b.getAttribute('data-delete-kudos')));
    });
    const shoutoutBtn = root.querySelector('#fun-shoutout-btn');
    if (shoutoutBtn) shoutoutBtn.addEventListener('click', () => {
      const pool = state.employees.filter(e => e.status !== 'Terminated');
      if (pool.length === 0) return;
      let pick;
      do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && pick.id === ui.funShoutoutId);
      ui.funShoutoutId = pick.id;
      render();
    });

    root.querySelectorAll('[data-nav]').forEach(elx => {
      elx.addEventListener('click', () => {
        ui.tab = elx.getAttribute('data-nav');
        ui.showApplicantForm = false; ui.showEmployeeForm = false; ui.showOpeningForm = false;
        ui.editApplicantId = null; ui.editEmployeeId = null; ui.editOpeningId = null;
        ui.conversionApplicantId = null;
        render();
      });
    });

    root.querySelectorAll('[data-recruitment-subtab]').forEach(elx => {
      elx.addEventListener('click', () => {
        ui.recruitmentSubtab = elx.getAttribute('data-recruitment-subtab');
        ui.showApplicantForm = false; ui.editApplicantId = null;
        ui.showOpeningForm = false; ui.editOpeningId = null;
        render();
      });
    });

    root.querySelectorAll('[data-hr-subtab]').forEach(elx => {
      elx.addEventListener('click', () => {
        ui.hrSubtab = elx.getAttribute('data-hr-subtab');
        ui.showEmployeeForm = false; ui.editEmployeeId = null; ui.conversionApplicantId = null;
        render();
      });
    });

    // Applicants
    const addApplicantBtn = root.querySelector('[data-add-applicant]');
    if (addApplicantBtn) addApplicantBtn.addEventListener('click', () => { ui.showApplicantForm = true; ui.editApplicantId = null; render(); });
    const cancelApplicant = root.querySelector('[data-cancel-applicant]');
    if (cancelApplicant) cancelApplicant.addEventListener('click', () => { ui.showApplicantForm = false; ui.editApplicantId = null; render(); });
    const applicantFormEl = root.querySelector('#applicant-form');
    if (applicantFormEl) applicantFormEl.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const fd = new FormData(applicantFormEl);
      upsertApplicant({
        name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'),
        position: fd.get('position'), openingId: fd.get('openingId') || null,
        stage: fd.get('stage'), appliedDate: fd.get('appliedDate')
      }, ui.editApplicantId);
    });
    root.querySelectorAll('[data-stage-select]').forEach(s => {
      s.addEventListener('change', () => setApplicantStage(s.getAttribute('data-stage-select'), s.value));
    });
    root.querySelectorAll('[data-edit-applicant]').forEach(b => {
      b.addEventListener('click', () => { ui.editApplicantId = b.getAttribute('data-edit-applicant'); ui.showApplicantForm = true; render(); });
    });
    root.querySelectorAll('[data-delete-applicant]').forEach(b => {
      b.addEventListener('click', () => deleteApplicant(b.getAttribute('data-delete-applicant')));
    });
    root.querySelectorAll('[data-convert]').forEach(b => {
      b.addEventListener('click', () => convertToEmployee(b.getAttribute('data-convert')));
    });

    // Employees
    const addEmployeeBtn = root.querySelector('[data-add-employee]');
    if (addEmployeeBtn) addEmployeeBtn.addEventListener('click', () => { ui.showEmployeeForm = true; ui.editEmployeeId = null; ui.prefillEmployee = null; ui.conversionApplicantId = null; render(); });
    const cancelEmployee = root.querySelector('[data-cancel-employee]');
    if (cancelEmployee) cancelEmployee.addEventListener('click', () => { ui.showEmployeeForm = false; ui.editEmployeeId = null; ui.prefillEmployee = null; ui.conversionApplicantId = null; render(); });
    const employeeFormEl = root.querySelector('#employee-form');
    if (employeeFormEl) employeeFormEl.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const fd = new FormData(employeeFormEl);
      upsertEmployee({
        name: fd.get('name'), email: fd.get('email'), position: fd.get('position'),
        department: fd.get('department'), salary: Number(fd.get('salary')),
        hireDate: fd.get('hireDate'), endDate: fd.get('endDate') || null, status: fd.get('status'),
        dateOfBirth: fd.get('dateOfBirth') || null, phone: fd.get('phone'), personalEmail: fd.get('personalEmail'),
        address: fd.get('address'), emergencyName: fd.get('emergencyName'),
        emergencyRelationship: fd.get('emergencyRelationship'), emergencyPhone: fd.get('emergencyPhone')
      }, ui.editEmployeeId);
    });
    root.querySelectorAll('[data-toggle-employee]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-toggle-employee');
        ui.expandedEmployeeId = ui.expandedEmployeeId === id ? null : id;
        render();
      });
    });
    root.querySelectorAll('[data-edit-employee]').forEach(b => {
      b.addEventListener('click', () => { ui.editEmployeeId = b.getAttribute('data-edit-employee'); ui.prefillEmployee = null; ui.showEmployeeForm = true; render(); });
    });
    root.querySelectorAll('[data-delete-employee]').forEach(b => {
      b.addEventListener('click', () => deleteEmployee(b.getAttribute('data-delete-employee')));
    });

    // Job openings
    const addOpeningBtn = root.querySelector('[data-add-opening]');
    if (addOpeningBtn) addOpeningBtn.addEventListener('click', () => { ui.showOpeningForm = true; ui.editOpeningId = null; render(); });
    const cancelOpening = root.querySelector('[data-cancel-opening]');
    if (cancelOpening) cancelOpening.addEventListener('click', () => { ui.showOpeningForm = false; ui.editOpeningId = null; render(); });
    const openingFormEl = root.querySelector('#opening-form');
    if (openingFormEl) openingFormEl.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const fd = new FormData(openingFormEl);
      upsertOpening({
        title: fd.get('title'), department: fd.get('department'),
        headcountNeeded: Number(fd.get('headcountNeeded')), status: fd.get('status'),
        description: fd.get('description')
      }, ui.editOpeningId);
    });
    root.querySelectorAll('[data-edit-opening]').forEach(b => {
      b.addEventListener('click', () => { ui.editOpeningId = b.getAttribute('data-edit-opening'); ui.showOpeningForm = true; render(); });
    });
    root.querySelectorAll('[data-delete-opening]').forEach(b => {
      b.addEventListener('click', () => deleteOpening(b.getAttribute('data-delete-opening')));
    });

    // Onboarding
    root.querySelectorAll('[data-onboard-task]').forEach(cb => {
      cb.addEventListener('change', () => {
        const [empId, task] = cb.getAttribute('data-onboard-task').split('|||');
        toggleOnboardingTask(empId, task);
      });
    });
    root.querySelectorAll('[data-note-mark-sent]').forEach(b => {
      b.addEventListener('click', () => markWelcomeNoteStatus(b.getAttribute('data-note-mark-sent'), 'Sent'));
    });
    root.querySelectorAll('[data-note-mark-pending]').forEach(b => {
      b.addEventListener('click', () => markWelcomeNoteStatus(b.getAttribute('data-note-mark-pending'), 'Pending'));
    });

    // Policy library
    const addPolicyBtn = root.querySelector('[data-add-policy]');
    if (addPolicyBtn) addPolicyBtn.addEventListener('click', () => { ui.showPolicyForm = true; ui.editPolicyId = null; render(); });
    const cancelPolicy = root.querySelector('[data-cancel-policy]');
    if (cancelPolicy) cancelPolicy.addEventListener('click', () => { ui.showPolicyForm = false; ui.editPolicyId = null; render(); });
    const policyFormEl = root.querySelector('#policy-form');
    if (policyFormEl) policyFormEl.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const fd = new FormData(policyFormEl);
      upsertPolicy({ title: fd.get('title'), summary: fd.get('summary') }, ui.editPolicyId);
    });
    root.querySelectorAll('[data-edit-policy]').forEach(b => {
      b.addEventListener('click', () => { ui.editPolicyId = b.getAttribute('data-edit-policy'); ui.showPolicyForm = true; render(); });
    });
    root.querySelectorAll('[data-delete-policy]').forEach(b => {
      b.addEventListener('click', () => deletePolicy(b.getAttribute('data-delete-policy')));
    });

    // Materials
    root.querySelectorAll('[data-material-toggle]').forEach(cb => {
      cb.addEventListener('change', () => {
        const [empId, matId] = cb.getAttribute('data-material-toggle').split('|||');
        toggleMaterialIssued(empId, matId);
      });
    });
    root.querySelectorAll('[data-material-remove]').forEach(b => {
      b.addEventListener('click', () => {
        const [empId, matId] = b.getAttribute('data-material-remove').split('|||');
        removeMaterial(empId, matId);
      });
    });
    root.querySelectorAll('[data-material-add]').forEach(b => {
      b.addEventListener('click', () => {
        const empId = b.getAttribute('data-material-add');
        const input = root.querySelector(`[data-material-input="${empId}"]`);
        if (input && input.value.trim()) addMaterial(empId, input.value);
      });
    });
    root.querySelectorAll('[data-material-input]').forEach(input => {
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const empId = input.getAttribute('data-material-input');
          if (input.value.trim()) addMaterial(empId, input.value);
        }
      });
    });
    root.querySelectorAll('[data-material-quickadd]').forEach(b => {
      b.addEventListener('click', () => {
        const [empId, item] = b.getAttribute('data-material-quickadd').split('|||');
        addMaterial(empId, item);
      });
    });

    // IT Notifications
    const saveItEmailBtn = root.querySelector('#save-it-email');
    if (saveItEmailBtn) saveItEmailBtn.addEventListener('click', () => {
      state.settings.itEmail = root.querySelector('#it-email-input').value.trim();
      saveState();
    });
    root.querySelectorAll('[data-it-mark-sent]').forEach(b => {
      b.addEventListener('click', () => markITRequestStatus(b.getAttribute('data-it-mark-sent'), 'Sent'));
    });
    root.querySelectorAll('[data-it-mark-pending]').forEach(b => {
      b.addEventListener('click', () => markITRequestStatus(b.getAttribute('data-it-mark-pending'), 'Pending'));
    });
    root.querySelectorAll('[data-it-remove]').forEach(b => {
      b.addEventListener('click', () => deleteITRequest(b.getAttribute('data-it-remove')));
    });

    // Payroll
    const runBtn = root.querySelector('[data-run-payroll]');
    if (runBtn) runBtn.addEventListener('click', runPayroll);
    const saveSettingsBtn = root.querySelector('#save-payroll-settings');
    if (saveSettingsBtn) saveSettingsBtn.addEventListener('click', () => {
      const taxRate = Number(root.querySelector('#tax-rate-input').value);
      const benefitsFlat = Number(root.querySelector('#benefits-flat-input').value);
      state.settings = { taxRate, benefitsFlat };
      saveState();
    });
    root.querySelectorAll('[data-toggle-run]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-toggle-run');
        ui.expandedRunId = ui.expandedRunId === id ? null : id;
        render();
      });
    });
    root.querySelectorAll('[data-delete-run]').forEach(b => {
      b.addEventListener('click', () => deletePayrollRun(b.getAttribute('data-delete-run')));
    });
  }

  loadState();
})();
</script>
