execution_056:
  plan: plans/056-closing-openings.md
  why: the maintainer's task.md round — "i dont know why do we have that much open positions … just to have a way of closing them (abandon) and deleting if needed"
  what_shipped:
    - migration 0071 — jobs.closed_at / closed_by / closed_reason, the BEFORE UPDATE trigger app.jobs_closing_stamp (entering closed stamps what the writer left out, leaving closed clears all three, staying closed is never re-dated), and close_jobs(ids, reason, withdraw) returning {closed, already_closed, withdrawn}
    - the Job openings tab is now the sweep: row selection (the header box takes the whole filtered list), "Close N selected" opening CloseJobsDialog, the closing line under a closed row's status, per-row Delete reusing lib/hiringDelete.ts and the company page's rule
    - app/src/lib/closeJobs.ts + tests (the selection sentences); hiringTabs carries applications total, companyId, status and the closing line
  review: Skill code-review medium, one round, three findings all fixed — (1) the withdraw switch was offered from the in-play count alone while close_jobs also demands candidates.review in EVERY company of the call, so a jobs.edit-only grant lost the close as well; CloseTarget now carries mayWithdraw and the dialog names the company that takes the option away. (2) the delete rule read applications(count) under the viewer's own RLS, so somebody without candidates.view read zero for every job and was told nothing had ever been received; jobDeletable gained countVisible and both call sites (this panel and the company page, which had the same defect since a8df79c) pass it. (3) the stamp trigger was before update only, so a job inserted as closed kept a status its columns contradicted; it is before insert or update now.
  verification: local-verify SMOKE TESTS PASSED (71 migrations); app vitest 553; vue-tsc clean; vite build clean. E2E close-openings.spec.ts is WRITTEN BUT NOT RUN — it needs 0071 on live.
  BLOCKING_ON_MAINTAINER: apply 0071 BEFORE pushing / deploying main. The app reads jobs.closed_at and calls close_jobs; main deploys to Vercel, so a push ahead of the migration breaks Hiring → Job openings.
  load_bearing_rulings:
    - abandoning = close + withdraw, one action with a switch, pre-ticked when anybody is in play
    - withdrawn, not rejected — nobody judged these people, the opening went away
    - hired / rejected / already-withdrawn rows are never touched
    - reopening clears the stamp and never un-withdraws anybody (the talent pool is the way back)
    - a job already closed is counted as already_closed, so re-running a selection is harmless
    - one refusal rolls the whole call back, and the message names the company and the job
  follow_ups_from_056 (none blocking):
    - the sub-status of a withdrawn row goes null (0069's default); a re-opened application would start from the stage's default again
    - Job openings loads every job and pages the non-terminal applications; the per-job total now comes from PostgREST's embedded count instead, so the read did not grow
    - closing does not touch job_channels — a job closed here can still read `live` on a channel until somebody closes it there
    - no bulk reopen; reopening stays one job at a time on the job page

