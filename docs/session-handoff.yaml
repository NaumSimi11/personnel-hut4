# ---------------------------------------------------------------------------
review_round_2026_09_23:
  what: one code-review pass over the uncommitted 056 + 057 + xlsx work; five findings, all fixed and re-verified
  findings:
    - 0071's stamp trigger fired on INSERT too, so a job the Zoho import wrote as already closed was dated today and attributed to whoever ran the import — the exact invention the trigger exists to prevent. It now stamps only a job that MOVES into closed; a row that arrives closed keeps whatever stamp it was given (usually none) and the app names no author for it.
    - CloseJobsDialog disabled its confirm whenever every picked opening was already closed, so candidates still in play on a long-closed opening — most of the imported backlog — could never be withdrawn. "Nothing to do" now also requires nobody left to withdraw, and the question says so.
    - save_task re-checked may_connect_task for EVERY id on each save, so an owner could not save a title once somebody else had connected a colleague of theirs. Only newly added people are checked now; taking somebody off needs no permission.
    - TaskDialog showed chips only for people the viewer may connect, so a colleague added by HR could never be unticked. The chips are now the union of connectable and whoever is already on the task.
    - the xlsx writer did not deduplicate sheet names, and two that collide (directly, or after the 31-character truncation) make a workbook Excel refuses to open.

