rules_from_the_maintainer:
  - never git push unless told in that message (the harness also blocks push; the maintainer pushes himself)
  - never print values from .env.local or .env.hr-hut4.local (the latter is read-only Field Notebook creds)
  - commit trailer: "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
  - blunt, short answers to simple questions; no hedging
  - every company filter dropdown uses components/CompanyFilter.vue
  - "today" in the app = todayDb() (UTC), matching Postgres current_date
  - one shared visibility rule: app.can_view_person / capabilities — never invent a parallel scope (0036 lesson)
  - a tile or card the viewer may not see is absent, never a zero

workflow_per_slice:
  - plans/NNN-*.md (numbered), then migration supabase/migrations/NNNN_*.sql
  - local verify: PATH="/c/Program Files/PostgreSQL/18/bin:$PATH" bash supabase/tests/local-verify.sh  (needs Docker Desktop running; start it with Start-Process "$env:ProgramFiles\Docker\Docker\Docker Desktop.exe" and wait for `docker info`)
  - smoke blocks: supabase/tests/smoke.sql, splice new block BEFORE the line "-- ================================================================ 0028" (current order: 0027, 0029, 0031, 0032, 0033, 0034, 0035/0036, 0028)
  - apply live: psql "$(grep '^SUPABASE_DB_URL=' .env.local | cut -d= -f2- | tr -d '\r\"')" -v ON_ERROR_STOP=1 -q -f supabase/migrations/NNNN.sql   (use PGCLIENTENCODING=UTF8 for queries with non-ASCII)
  - types: app/src/types/database.ts is hand-maintained — add the table block (alphabetical) and the Functions entry
  - tests: cd app && npx vitest run ; npx vue-tsc --noEmit -p tsconfig.json ; npx playwright test e2e/<spec> --reporter=line (workers=1, live DB, specs seed and clean with SUPABASE_SECRET_KEY; base URL 5199 via webServer)
  - review: Skill code-review medium; fix findings; commit; update plans/README.md row + docs/development-plan.md Done table
  - file edits: write Python scripts to the scratchpad (or use the Edit tool); bash heredocs with quotes/`$$` break — do not use them for SQL/JS content
  - run the app: cd server && npm run dev (8787) ; cd app && npm run dev (Vite picks 5173 or 5174) — check with curl before assuming the port
  - after a pull that touches server/package.json: cd server && npm install

